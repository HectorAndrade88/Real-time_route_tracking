<!doctype html>
<!--
  Real-time route self-tracking MVP — airport rental pickup (PMI).

  Brand note: the operator mark rendered here is a generic vehicle glyph, not the
  trademarked logo of any rental company. Drop a licensed asset into
  `routeConfiguration.operator.logoImageDataUri` (a data: URI) to replace it.

  Known constraints (MVP):

  1. Background location is not reliable on the web. When the phone is locked or the tab
     goes to background, the OS suspends timers and geolocation updates stop. Mitigation
     used here: Screen Wake Lock API while tracking. Production path: native app
     (.NET MAUI) with background location permissions.

  2. The public OSRM instance (router.project-osrm.org) is a demo server with usage
     limits and no SLA. Do not use it in production. Production options: precompute each
     route option once and embed it in `routeOptions[].precomputedPath` (fully local, no
     network call), or self-host OSRM / Valhalla.

  3. Real geolocation requires a secure context (https or localhost) and is commonly
     blocked inside cross-origin iframes. The simulation mode covers that case and
     starts automatically when real geolocation is unavailable or denied.

  4. Airport zone polygons follow the naming of standard airport zoning (security
     restricted area, airside, service roads, public transport, rental handover) but the
     coordinates are approximations for the demo. Replace them with the official AENA
     cartography before operational use. Regulation texts are demo content and are not an
     official publication of any airport or rental operator.
-->
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Consola de recogida · PMI</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --brand: #00843D;
      --brand-dark: #00602C;
      --brand-soft: #E8F3EC;
      --bg: #F1F4F6;
      --surface: #FFFFFF;
      --surface-alt: #F7F9FA;
      --line: #DDE4E9;
      --line-strong: #C6D1D9;
      --ink: #16202A;
      --ink-dim: #5D6C7B;
      --inactive-route: #8494A2;
      --status-on-route: #00843D;
      --status-deviation: #B36A00;
      --status-restricted: #B3261E;

      --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-data: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

      --radius: 10px;
      --gutter: 18px;
      --shadow-card: 0 1px 2px rgba(22, 32, 42, .06), 0 1px 3px rgba(22, 32, 42, .04);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
    }

    body {
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
    }

    :where(button, a, select, [tabindex]):focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
      border-radius: 6px;
    }

    .icon {
      width: 20px;
      height: 20px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .app-bar {
      display: flex;
      align-items: center;
      gap: var(--gutter);
      padding: 0 var(--gutter);
      min-height: 62px;
      background: var(--surface);
      border-bottom: 3px solid var(--brand);
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 11px;
      padding-right: var(--gutter);
      border-right: 1px solid var(--line);
      flex: none;
    }

    .brand-lockup__mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: var(--brand);
      color: #FFFFFF;
      overflow: hidden;
    }

    .brand-lockup__mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand-lockup__mark .icon {
      width: 22px;
      height: 22px;
      stroke-width: 1.7;
    }

    .brand-lockup__text {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .brand-lockup__name {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -.01em;
      color: var(--brand-dark);
      white-space: nowrap;
    }

    .brand-lockup__unit {
      font-size: 10.5px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--ink-dim);
      white-space: nowrap;
    }

    .route-identity {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .route-identity__eyebrow {
      font-family: var(--font-data);
      font-size: 10px;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--ink-dim);
      white-space: nowrap;
    }

    .route-identity__name {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .language-switcher {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: none;
    }

    .language-switcher__label {
      font-family: var(--font-data);
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }

    .language-switcher__select {
      appearance: none;
      padding: 8px 30px 8px 11px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background-color: var(--surface);
      background-image: linear-gradient(45deg, transparent 50%, var(--ink-dim) 50%), linear-gradient(135deg, var(--ink-dim) 50%, transparent 50%);
      background-position: calc(100% - 15px) 17px, calc(100% - 11px) 17px;
      background-size: 4px 4px, 4px 4px;
      background-repeat: no-repeat;
      color: var(--ink);
      font-family: var(--font-ui);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 0 1 auto;
      min-width: 0;
      max-width: 34%;
      padding: 8px 14px 8px 11px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: var(--surface-alt);
      font-family: var(--font-data);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }

    .status-pill__dot {
      width: 9px;
      height: 9px;
      flex: none;
      border-radius: 50%;
      background: currentColor;
    }

    .status-pill>span:last-child {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .status-pill[data-state="on-route"] {
      color: var(--status-on-route);
      border-color: #A9D6BB;
      background: var(--brand-soft);
    }

    .status-pill[data-state="deviation"] {
      color: var(--status-deviation);
      border-color: #E7CB98;
      background: #FBF3E4;
    }

    .status-pill[data-state="restricted"] {
      color: var(--status-restricted);
      border-color: #E6B4B0;
      background: #FBEBEA;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      min-height: 0;
    }

    .map-stage {
      position: relative;
      min-height: 0;
    }

    #map {
      position: absolute;
      inset: 0;
      background: var(--bg);
    }

    .leaflet-container {
      background: var(--bg);
      font-family: var(--font-ui);
    }

    .leaflet-tile {
      filter: saturate(.88) contrast(1.02) brightness(1.01);
    }

    .leaflet-control-zoom a {
      background: var(--surface);
      color: var(--ink);
      border-color: var(--line);
    }

    .leaflet-control-zoom a:hover {
      background: var(--brand-soft);
      color: var(--brand-dark);
    }

    .leaflet-control-attribution {
      background: rgba(255, 255, 255, .86);
      color: var(--ink-dim);
    }

    .leaflet-control-attribution a {
      color: var(--ink-dim);
    }

    .leaflet-bar {
      border: 1px solid var(--line);
      box-shadow: var(--shadow-card);
    }

    .leaflet-tooltip {
      background: var(--surface);
      border: 1px solid var(--line-strong);
      box-shadow: var(--shadow-card);
      color: var(--ink);
      font-family: var(--font-ui);
      font-size: 11.5px;
      font-weight: 600;
    }

    .leaflet-tooltip-top::before {
      border-top-color: var(--line-strong);
    }

    .leaflet-tooltip.zone-tooltip {
      font-family: var(--font-data);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .leaflet-tooltip.zone-tooltip--prohibited {
      color: var(--status-restricted);
      border-color: #E6B4B0;
    }

    .leaflet-tooltip.zone-tooltip--regulated {
      color: var(--status-deviation);
      border-color: #E7CB98;
    }

    .leaflet-tooltip.zone-tooltip::before {
      display: none;
    }

    .notice-stack {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 900;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: min(520px, calc(100% - 112px));
      pointer-events: none;
    }

    .notice {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--brand);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      font-size: 12.5px;
      line-height: 1.45;
      box-shadow: 0 6px 20px rgba(22, 32, 42, .12);
    }

    .notice[data-tone="warning"] {
      border-left-color: var(--status-deviation);
    }

    .notice[data-tone="alert"] {
      border-left-color: var(--status-restricted);
    }

    .notice .icon {
      width: 17px;
      height: 17px;
      margin-top: 1px;
      color: var(--ink-dim);
    }

    .notice[data-tone="warning"] .icon {
      color: var(--status-deviation);
    }

    .notice[data-tone="alert"] .icon {
      color: var(--status-restricted);
    }

    .endpoint-marker__pin {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--surface);
      border: 4px solid var(--brand-dark);
      box-shadow: 0 1px 4px rgba(22, 32, 42, .4);
    }

    .endpoint-marker__pin--destination {
      border-radius: 3px;
      background: var(--brand-dark);
      box-shadow: 0 0 0 2px var(--surface), 0 1px 4px rgba(22, 32, 42, .4);
    }

    .vehicle-marker {
      color: var(--brand);
    }

    .vehicle-marker[data-state="deviation"] {
      color: var(--status-deviation);
    }

    .vehicle-marker[data-state="restricted"] {
      color: var(--status-restricted);
    }

    .vehicle-marker__core {
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, .92), 0 1px 4px rgba(22, 32, 42, .45);
    }

    .vehicle-marker__pulse {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid currentColor;
      opacity: 0;
      animation: vehiclePulse 2.6s cubic-bezier(.2, .6, .3, 1) infinite;
    }

    @keyframes vehiclePulse {
      0% {
        transform: scale(.7);
        opacity: .6;
      }

      100% {
        transform: scale(3.1);
        opacity: 0;
      }
    }

    .briefing {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
      min-height: 0;
      overflow-y: auto;
      background: var(--surface);
      border-left: 1px solid var(--line);
    }

    .briefing>* {
      flex: none;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    .booking__banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: var(--brand-soft);
      border-bottom: 1px solid #CFE4D8;
    }

    .booking__vehicle {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .booking__class {
      font-family: var(--font-data);
      font-size: 10px;
      letter-spacing: .11em;
      text-transform: uppercase;
      color: var(--brand-dark);
    }

    .booking__model {
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -.01em;
      color: var(--ink);
    }

    .booking__art {
      color: var(--brand);
      opacity: .9;
      flex: none;
    }

    .booking__art svg {
      width: 74px;
      height: 40px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .booking__grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
    }

    .booking__field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 11px 16px;
      background: var(--surface);
      min-width: 0;
    }

    .booking__label {
      font-size: 10px;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }

    .booking__value {
      font-family: var(--font-data);
      font-size: 12px;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 0 2px 9px;
    }

    .section-heading__title {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .section-heading__hint {
      font-family: var(--font-data);
      font-size: 10px;
      letter-spacing: .06em;
      color: var(--ink-dim);
      text-align: right;
    }

    .option-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .option {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--line-strong);
      border-radius: 9px;
      background: var(--surface);
      color: inherit;
      font-family: inherit;
      cursor: pointer;
      transition: border-color .16s ease, background-color .16s ease;
    }

    .option:hover {
      background: var(--surface-alt);
    }

    .option[aria-pressed="true"] {
      border-color: #A9D6BB;
      border-left-color: var(--brand);
      background: var(--brand-soft);
    }

    .option__head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .option__name {
      font-size: 13px;
      font-weight: 650;
      line-height: 1.3;
      color: var(--ink);
    }

    .option__badge {
      font-family: var(--font-data);
      font-size: 9px;
      letter-spacing: .09em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--brand);
      color: #FFFFFF;
      flex: none;
    }

    .option__badge--recommended {
      background: var(--surface-alt);
      color: var(--ink-dim);
      border: 1px solid var(--line);
    }

    .option__metrics {
      display: flex;
      gap: 12px;
      font-family: var(--font-data);
      font-size: 11.5px;
      color: var(--ink-dim);
      margin-bottom: 4px;
    }

    .option__metric {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .option__metric .icon {
      width: 13px;
      height: 13px;
    }

    .option__detail {
      font-size: 11.5px;
      line-height: 1.45;
      color: var(--ink-dim);
    }

    .zone-banner {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 12px;
      margin-bottom: 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-alt);
      color: var(--ink-dim);
      font-size: 12px;
    }

    .zone-banner .icon {
      width: 17px;
      height: 17px;
    }

    .zone-banner__text {
      min-width: 0;
    }

    .zone-banner__label {
      display: block;
      font-family: var(--font-data);
      font-size: 9.5px;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .zone-banner__value {
      display: block;
      font-weight: 600;
      color: var(--ink);
    }

    .zone-banner[data-enforcement="prohibited"] {
      border-color: #E6B4B0;
      background: #FBEBEA;
      color: var(--status-restricted);
    }

    .zone-banner[data-enforcement="regulated"] {
      border-color: #E7CB98;
      background: #FBF3E4;
      color: var(--status-deviation);
    }

    .rule-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .rule {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 11px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--line-strong);
      border-radius: 9px;
      background: var(--surface);
      transition: border-color .18s ease, background-color .18s ease, box-shadow .18s ease;
    }

    .rule__glyph {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--surface-alt);
      color: var(--ink-dim);
    }

    .rule__body {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .rule__head {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .rule__code,
    .rule__tag {
      font-family: var(--font-data);
      font-size: 9px;
      letter-spacing: .08em;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--surface-alt);
      border: 1px solid var(--line);
      color: var(--ink-dim);
      white-space: nowrap;
    }

    .rule__tag[data-enforcement="prohibited"] {
      color: var(--status-restricted);
      border-color: #E6B4B0;
      background: #FBEBEA;
    }

    .rule__tag[data-enforcement="regulated"] {
      color: var(--status-deviation);
      border-color: #E7CB98;
      background: #FBF3E4;
    }

    .rule__title {
      font-size: 12.5px;
      font-weight: 620;
      line-height: 1.32;
      color: var(--ink);
      width: 100%;
    }

    .rule__detail {
      font-size: 11.5px;
      line-height: 1.45;
      color: var(--ink-dim);
      margin: 0;
    }

    .rule[data-enforcement="prohibited"] {
      border-left-color: var(--status-restricted);
    }

    .rule[data-enforcement="regulated"] {
      border-left-color: var(--status-deviation);
    }

    .rule[data-enforcement="route"] {
      border-left-color: var(--brand);
    }

    .rule[data-enforcement="route"] .rule__glyph {
      background: var(--brand-soft);
      color: var(--brand-dark);
    }

    .rule[data-active="true"] {
      border-color: #E6B4B0;
      background: #FDF6F5;
      box-shadow: 0 0 0 3px rgba(179, 38, 30, .08);
    }

    .rule[data-active="true"] .rule__glyph {
      background: #FBEBEA;
      color: var(--status-restricted);
    }

    .console {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: var(--gutter);
      padding: 13px var(--gutter) calc(13px + env(safe-area-inset-bottom));
      background: var(--surface);
      border-top: 1px solid var(--line);
    }

    .telemetry {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 1px;
      flex: 1 1 auto;
      min-width: 0;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .telemetry__cell {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 9px 12px;
      background: var(--surface-alt);
      min-width: 0;
    }

    .telemetry__label {
      font-family: var(--font-data);
      font-size: 9.5px;
      letter-spacing: .11em;
      text-transform: uppercase;
      color: var(--ink-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .telemetry__value {
      font-family: var(--font-data);
      font-size: 15px;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.01em;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .telemetry__cell[data-state="on-route"] .telemetry__value {
      color: var(--status-on-route);
    }

    .telemetry__cell[data-state="deviation"] .telemetry__value {
      color: var(--status-deviation);
    }

    .telemetry__cell[data-state="restricted"] .telemetry__value {
      color: var(--status-restricted);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 9px;
      flex: none;
    }

    .button {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 16px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: var(--surface);
      color: var(--ink);
      font-family: var(--font-ui);
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: .01em;
      cursor: pointer;
      transition: background-color .16s ease, border-color .16s ease, color .16s ease;
    }

    .button .icon {
      width: 16px;
      height: 16px;
    }

    .button:hover {
      background: var(--surface-alt);
      border-color: var(--ink-dim);
    }

    .button--primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #FFFFFF;
    }

    .button--primary:hover {
      background: var(--brand-dark);
      border-color: var(--brand-dark);
    }

    .button[aria-pressed="true"] {
      border-color: var(--brand);
      color: var(--brand-dark);
      background: var(--brand-soft);
    }

    .button--primary[aria-pressed="true"] {
      color: #FFFFFF;
      background: var(--brand-dark);
      border-color: var(--brand-dark);
    }

    .route-source {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-data);
      font-size: 10px;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--ink-dim);
      margin-right: auto;
    }

    .route-source .icon {
      width: 14px;
      height: 14px;
    }

    @media (max-width: 1180px) {
      .workspace {
        grid-template-columns: minmax(0, 1fr) 330px;
      }

      .brand-lockup__unit {
        display: none;
      }
    }

    @media (max-width: 980px) {
      .workspace {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(46vh, 1fr) auto;
        overflow-y: auto;
      }

      .map-stage {
        min-height: 46vh;
      }

      .briefing {
        border-left: none;
        border-top: 1px solid var(--line);
        /* Permitimos scroll interno en móvil para que las secciones no se pierdan
         al bajar la pantalla. Calculamos una altura máxima aproximada restando
         la altura de cabecera y pie de página. */
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        max-height: calc(100dvh - 62px - 72px);
        padding-bottom: 8px;
      }

      /* Mantener los títulos de sección visibles al desplazarse dentro de la ficha */
      .section-heading {
        position: sticky;
        top: 0;
        background: var(--surface);
        z-index: 3;
        padding-top: 8px;
        padding-bottom: 6px;
      }

      .app-bar {
        flex-wrap: wrap;
        padding-top: 10px;
        padding-bottom: 10px;
        row-gap: 10px;
      }

      .brand-lockup {
        border-right: none;
      }

      .brand-lockup__unit {
        display: block;
      }

      .status-pill {
        max-width: none;
        order: 3;
        width: 100%;
      }

      .console {
        flex-direction: column;
        align-items: stretch;
      }

      .telemetry {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .telemetry__cell:last-child {
        grid-column: span 2;
      }
    }

    @media (max-width: 560px) {
      .telemetry {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .booking__grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .route-identity {
        order: 2;
      }

      .language-switcher {
        order: 1;
      }

      .route-identity__name {
        font-size: 14px;
      }

      .button {
        flex: 1;
        justify-content: center;
      }

      /* En pantallas pequeñas convertimos la lista de opciones en carrusel
       horizontal para que las tarjetas no queden recortadas y sean fáciles
       de deslizar con el pulgar. */
      .option-list {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding: 8px 6px 14px;
        -webkit-overflow-scrolling: touch;
      }

      .option {
        min-width: 82%;
        flex: 0 0 auto;
        white-space: normal;
      }

      .option__metrics {
        flex-wrap: wrap;
        gap: 8px;
      }

      .section-heading__title {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .vehicle-marker__pulse {
        animation: none;
        opacity: .4;
        transform: scale(1.6);
      }

      .button,
      .rule,
      .option {
        transition: none;
      }
    }
  </style>
</head>

    const TrackingState = {
      UNKNOWN: "unknown",
      ON_ROUTE: "on-route",
      DEVIATION: "deviation",
      RESTRICTED: "restricted"
    };

    const PathSource = {
      ROUTING_SERVICE: "routing-service",
      EMBEDDED: "embedded",
      STRAIGHT_FALLBACK: "straight-fallback"
    };

    const ZoneEnforcement = {
      PROHIBITED: "prohibited",
      REGULATED: "regulated",
      ROUTE: "route"
    };

    const PositionOrigin = {
      DEVICE: "device",
      SIMULATION: "simulation"
    };

    class GeoMath {
      static EARTH_RADIUS_METERS = 6371008.8;

      static toRadians(degrees) {
        return (degrees * Math.PI) / 180;
      }

      static haversineDistanceMeters(firstPoint, secondPoint) {
        const latitudeDelta = GeoMath.toRadians(secondPoint[0] - firstPoint[0]);
        const longitudeDelta = GeoMath.toRadians(secondPoint[1] - firstPoint[1]);
        const firstLatitudeRadians = GeoMath.toRadians(firstPoint[0]);
        const secondLatitudeRadians = GeoMath.toRadians(secondPoint[0]);
        const chordFactor =
          Math.sin(latitudeDelta / 2) ** 2 +
          Math.cos(firstLatitudeRadians) * Math.cos(secondLatitudeRadians) * Math.sin(longitudeDelta / 2) ** 2;
        return 2 * GeoMath.EARTH_RADIUS_METERS * Math.asin(Math.min(1, Math.sqrt(chordFactor)));
      }

      static projectToLocalMeters(point, referencePoint) {
        const referenceLatitudeRadians = GeoMath.toRadians(referencePoint[0]);
        return {
          x: GeoMath.toRadians(point[1] - referencePoint[1]) * Math.cos(referenceLatitudeRadians) * GeoMath.EARTH_RADIUS_METERS,
          y: GeoMath.toRadians(point[0] - referencePoint[0]) * GeoMath.EARTH_RADIUS_METERS
        };
      }

      static distanceFromPointToSegmentMeters(point, segmentStart, segmentEnd) {
        const start = GeoMath.projectToLocalMeters(segmentStart, point);
        const end = GeoMath.projectToLocalMeters(segmentEnd, point);
        const segmentX = end.x - start.x;
        const segmentY = end.y - start.y;
        const segmentLengthSquared = segmentX * segmentX + segmentY * segmentY;

        if (segmentLengthSquared === 0) {
          return Math.hypot(start.x, start.y);
        }

        const projectionRatio = Math.max(
          0,
          Math.min(1, -(start.x * segmentX + start.y * segmentY) / segmentLengthSquared)
        );
        const closestX = start.x + projectionRatio * segmentX;
        const closestY = start.y + projectionRatio * segmentY;
        return Math.hypot(closestX, closestY);
      }

      static distanceFromPointToPolylineMeters(point, polyline) {
        if (!Array.isArray(polyline) || polyline.length === 0) {
          return Number.POSITIVE_INFINITY;
        }
        if (polyline.length === 1) {
          return GeoMath.haversineDistanceMeters(point, polyline[0]);
        }

        let shortestDistance = Number.POSITIVE_INFINITY;
        for (let index = 0; index < polyline.length - 1; index += 1) {
          const segmentDistance = GeoMath.distanceFromPointToSegmentMeters(point, polyline[index], polyline[index + 1]);
          if (segmentDistance < shortestDistance) {
            shortestDistance = segmentDistance;
          }
        }
        return shortestDistance;
      }

      static isPointInsidePolygon(point, polygon) {
        if (!Array.isArray(polygon) || polygon.length < 3) {
          return false;
        }

        const pointLatitude = point[0];
        const pointLongitude = point[1];
        let isInside = false;

        for (let current = 0, previous = polygon.length - 1; current < polygon.length; previous = current, current += 1) {
          const currentLatitude = polygon[current][0];
          const currentLongitude = polygon[current][1];
          const previousLatitude = polygon[previous][0];
          const previousLongitude = polygon[previous][1];

          const straddlesRay = currentLatitude > pointLatitude !== previousLatitude > pointLatitude;
          if (!straddlesRay) {
            continue;
          }

          const intersectionLongitude =
            ((previousLongitude - currentLongitude) * (pointLatitude - currentLatitude)) /
            (previousLatitude - currentLatitude) +
            currentLongitude;

          if (pointLongitude < intersectionLongitude) {
            isInside = !isInside;
          }
        }

        return isInside;
      }

      static interpolateBetween(firstPoint, secondPoint, ratio) {
        return [
          firstPoint[0] + (secondPoint[0] - firstPoint[0]) * ratio,
          firstPoint[1] + (secondPoint[1] - firstPoint[1]) * ratio
        ];
      }

      static densifyPolyline(polyline, stepMeters) {
        if (!Array.isArray(polyline) || polyline.length < 2) {
          return Array.isArray(polyline) ? polyline.slice() : [];
        }

        const densifiedPoints = [polyline[0]];

        for (let index = 0; index < polyline.length - 1; index += 1) {
          const segmentStart = polyline[index];
          const segmentEnd = polyline[index + 1];
          const segmentLength = GeoMath.haversineDistanceMeters(segmentStart, segmentEnd);
          const stepCount = Math.max(1, Math.ceil(segmentLength / stepMeters));

          for (let step = 1; step <= stepCount; step += 1) {
            densifiedPoints.push(GeoMath.interpolateBetween(segmentStart, segmentEnd, step / stepCount));
          }
        }

        return densifiedPoints;
      }

      static buildCumulativeDistances(polyline) {
        const cumulativeDistances = [0];
        for (let index = 1; index < polyline.length; index += 1) {
          cumulativeDistances.push(
            cumulativeDistances[index - 1] + GeoMath.haversineDistanceMeters(polyline[index - 1], polyline[index])
          );
        }
        return cumulativeDistances;
      }

      static measurePolylineLengthMeters(polyline) {
        const cumulativeDistances = GeoMath.buildCumulativeDistances(polyline);
        return cumulativeDistances[cumulativeDistances.length - 1] ?? 0;
      }
    }

    class LocalizationService {
      constructor(localizationCatalog) {
        this.catalog = localizationCatalog;
        this.languageCode = this.readStoredLanguage() ?? localizationCatalog.defaultLanguageCode;
        this.changeListeners = [];
      }

      get availableLanguages() {
        return this.catalog.languages;
      }

      get currentLanguageCode() {
        return this.languageCode;
      }

      readStoredLanguage() {
        try {
          const storedCode = window.localStorage.getItem(this.catalog.storageKey);
          return this.catalog.languages.some((language) => language.code === storedCode) ? storedCode : null;
        } catch (storageError) {
          return null;
        }
      }

      persistLanguage(languageCode) {
        try {
          window.localStorage.setItem(this.catalog.storageKey, languageCode);
        } catch (storageError) {
          return;
        }
      }

      onChange(listener) {
        this.changeListeners.push(listener);
      }

      setLanguage(languageCode) {
        if (languageCode === this.languageCode || !this.catalog.dictionaries[languageCode]) {
          return;
        }
        this.languageCode = languageCode;
        this.persistLanguage(languageCode);
        document.documentElement.lang = languageCode;
        this.changeListeners.forEach((listener) => listener(languageCode));
      }

      resolvePath(dictionary, path) {
        return path.split(".").reduce((node, key) => (node === undefined || node === null ? undefined : node[key]), dictionary);
      }

      translate(path, replacements = {}) {
        const localizedValue =
          this.resolvePath(this.catalog.dictionaries[this.languageCode], path) ??
          this.resolvePath(this.catalog.dictionaries[this.catalog.defaultLanguageCode], path);

        if (typeof localizedValue !== "string") {
          return path;
        }

        return Object.entries(replacements).reduce(
          (text, [key, value]) => text.replaceAll(`{${key}}`, String(value)),
          localizedValue
        );
      }

      formatNumber(value, maximumFractionDigits = 1) {
        return new Intl.NumberFormat(this.languageCode, { maximumFractionDigits }).format(value);
      }

      applyToDocument() {
        document.querySelectorAll("[data-i18n]").forEach((element) => {
          element.textContent = this.translate(element.dataset.i18n);
        });
      }
    }

    class LanguageSwitcher {
      constructor(localizationService) {
        this.localizationService = localizationService;
        this.selectElement = document.getElementById("languageSelect");
      }

      render() {
        this.selectElement.replaceChildren(
          ...this.localizationService.availableLanguages.map((language) => {
            const optionElement = document.createElement("option");
            optionElement.value = language.code;
            optionElement.textContent = language.label;
            return optionElement;
          })
        );
        this.selectElement.value = this.localizationService.currentLanguageCode;
        this.selectElement.addEventListener("change", (changeEvent) =>
          this.localizationService.setLanguage(changeEvent.target.value)
        );
      }
    }

    class IconFactory {
      static create(iconName, className = "icon") {
        const svgElement = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svgElement.setAttribute("class", className);
        svgElement.setAttribute("aria-hidden", "true");
        const useElement = document.createElementNS("http://www.w3.org/2000/svg", "use");
        useElement.setAttribute("href", `#${iconName}`);
        svgElement.appendChild(useElement);
        return svgElement;
      }
    }

    class RoutePlanner {
      constructor(configuration) {
        this.configuration = configuration;
      }

      async resolveRouteOptions() {
        return Promise.all(this.configuration.routeOptions.map((routeOption) => this.resolveRouteOption(routeOption)));
      }

      async resolveRouteOption(routeOption) {
        const embeddedPath = RoutePlanner.readEmbeddedPath(routeOption);
        if (embeddedPath) {
          return this.buildResolvedOption(routeOption, embeddedPath, PathSource.EMBEDDED, null);
        }

        try {
          const routingResult = await this.requestStreetLevelRoute(routeOption);
          return this.buildResolvedOption(
            routeOption,
            routingResult.coordinates,
            PathSource.ROUTING_SERVICE,
            routingResult.durationSeconds
          );
        } catch (routingError) {
          return this.buildResolvedOption(routeOption, this.buildStraightPath(), PathSource.STRAIGHT_FALLBACK, null);
        }
      }

      buildResolvedOption(routeOption, coordinates, source, durationSeconds) {
        const distanceMeters = GeoMath.measurePolylineLengthMeters(coordinates);
        return {
          id: routeOption.id,
          isRecommended: routeOption.isRecommended === true,
          coordinates,
          source,
          distanceMeters,
          durationSeconds: durationSeconds ?? (distanceMeters / (this.configuration.simulationSpeedKmh / 3.6))
        };
      }

      static readEmbeddedPath(routeOption) {
        const candidate = routeOption.precomputedPath;
        if (!Array.isArray(candidate) || candidate.length < 2) {
          return null;
        }
        return candidate.map((coordinate) => [coordinate[0], coordinate[1]]);
      }

      buildStraightPath() {
        return [this.configuration.origin.slice(), this.configuration.destination.slice()];
      }

      async requestStreetLevelRoute(routeOption) {
        const waypoints = [this.configuration.origin, ...routeOption.viaPoints, this.configuration.destination]
          .map((coordinate) => `${coordinate[1]},${coordinate[0]}`)
          .join(";");
        const requestUrl =
          `${this.configuration.routingServiceBaseUrl}/route/v1/driving/${waypoints}` +
          "?overview=full&geometries=geojson";

        const abortController = new AbortController();
        const timeoutHandle = window.setTimeout(
          () => abortController.abort(),
          this.configuration.routingRequestTimeoutMs
        );

        try {
          const response = await fetch(requestUrl, { signal: abortController.signal });
          if (!response.ok) {
            throw new Error(`Routing service responded with status ${response.status}`);
          }

          const payload = await response.json();
          const route = payload?.routes?.[0];
          const geometryCoordinates = route?.geometry?.coordinates;
          if (payload.code !== "Ok" || !Array.isArray(geometryCoordinates) || geometryCoordinates.length < 2) {
            throw new Error("Routing service returned an unusable geometry");
          }

          return {
            coordinates: geometryCoordinates.map((coordinate) => [coordinate[1], coordinate[0]]),
            durationSeconds: route.duration
          };
        } finally {
          window.clearTimeout(timeoutHandle);
        }
      }
    }

    class RouteDeviationEvaluator {
      constructor(pathCoordinates, corridorMeters) {
        this.pathCoordinates = pathCoordinates;
        this.corridorMeters = corridorMeters;
      }

      distanceToRouteMeters(point) {
        return GeoMath.distanceFromPointToPolylineMeters(point, this.pathCoordinates);
      }

      isWithinCorridor(point) {
        return this.distanceToRouteMeters(point) <= this.corridorMeters;
      }
    }

    class AirportZoneEvaluator {
      constructor(regulations) {
        this.geofencedRegulations = (Array.isArray(regulations) ? regulations : []).filter((regulation) =>
          Array.isArray(regulation.polygon)
        );
      }

      get zones() {
        return this.geofencedRegulations;
      }

      findContainingZones(point) {
        return this.geofencedRegulations.filter((regulation) => GeoMath.isPointInsidePolygon(point, regulation.polygon));
      }

      findProhibitedZone(point) {
        return (
          this.findContainingZones(point).find(
            (regulation) => regulation.enforcement === ZoneEnforcement.PROHIBITED
          ) ?? null
        );
      }
    }

    class RouteModel {
      constructor({ routeOption, corridorMeters, zoneEvaluator }) {
        this.routeOption = routeOption;
        this.deviationEvaluator = new RouteDeviationEvaluator(routeOption.coordinates, corridorMeters);
        this.zoneEvaluator = zoneEvaluator;
      }

      get id() {
        return this.routeOption.id;
      }

      get coordinates() {
        return this.routeOption.coordinates;
      }

      distanceToRouteMeters(point) {
        return this.deviationEvaluator.distanceToRouteMeters(point);
      }

      isWithinCorridor(point) {
        return this.deviationEvaluator.isWithinCorridor(point);
      }

      evaluatePosition(point) {
        const distanceToRouteMeters = this.deviationEvaluator.distanceToRouteMeters(point);
        const containingZones = this.zoneEvaluator.findContainingZones(point);
        const prohibitedZone = containingZones.find((zone) => zone.enforcement === ZoneEnforcement.PROHIBITED) ?? null;

        if (prohibitedZone) {
          return {
            state: TrackingState.RESTRICTED,
            distanceToRouteMeters,
            containingZones,
            activeZone: prohibitedZone
          };
        }

        return {
          state: this.deviationEvaluator.isWithinCorridor(point) ? TrackingState.ON_ROUTE : TrackingState.DEVIATION,
          distanceToRouteMeters,
          containingZones,
          activeZone: containingZones[0] ?? null
        };
      }
    }

    class RouteOptionRegistry {
      constructor(routeModels) {
        this.routeModels = routeModels;
        this.activeIndex = Math.max(
          0,
          routeModels.findIndex((routeModel) => routeModel.routeOption.isRecommended)
        );
      }

      get activeModel() {
        return this.routeModels[this.activeIndex];
      }

      get models() {
        return this.routeModels;
      }

      selectById(routeOptionId) {
        const targetIndex = this.routeModels.findIndex((routeModel) => routeModel.id === routeOptionId);
        if (targetIndex < 0 || targetIndex === this.activeIndex) {
          return false;
        }
        this.activeIndex = targetIndex;
        return true;
      }

      findBetterMatchingModel(point) {
        if (this.activeModel.isWithinCorridor(point)) {
          return null;
        }
        return (
          this.routeModels.find(
            (routeModel) => routeModel !== this.activeModel && routeModel.isWithinCorridor(point)
          ) ?? null
        );
      }
    }

    class GeolocationTracker {
      constructor({ accuracyThresholdMeters, movingAverageWindow }) {
        this.accuracyThresholdMeters = accuracyThresholdMeters;
        this.movingAverageWindow = movingAverageWindow;
        this.recentPositions = [];
        this.previousSmoothedFix = null;
        this.lastKnownSpeedKmh = 0;
        this.watchIdentifier = null;
        this.fixListener = () => { };
        this.failureListener = () => { };
      }

      onFix(listener) {
        this.fixListener = listener;
      }

      onFailure(listener) {
        this.failureListener = listener;
      }

      get isSupported() {
        return typeof navigator !== "undefined" && "geolocation" in navigator;
      }

      get isRunning() {
        return this.watchIdentifier !== null;
      }

      start() {
        if (!this.isSupported) {
          this.failureListener({ reason: "unsupported" });
          return false;
        }
        if (this.isRunning) {
          return true;
        }

        this.watchIdentifier = navigator.geolocation.watchPosition(
          (browserPosition) => this.handleBrowserPosition(browserPosition),
          (positionError) => this.handleBrowserFailure(positionError),
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
        );
        return true;
      }

      stop() {
        if (!this.isRunning) {
          return;
        }
        navigator.geolocation.clearWatch(this.watchIdentifier);
        this.watchIdentifier = null;
        this.reset();
      }

      reset() {
        this.recentPositions = [];
        this.previousSmoothedFix = null;
        this.lastKnownSpeedKmh = 0;
      }

      handleBrowserFailure(positionError) {
        this.failureListener({
          reason: positionError.code === positionError.PERMISSION_DENIED ? "denied" : "unavailable"
        });
      }

      handleBrowserPosition(browserPosition) {
        const accuracyMeters = browserPosition.coords.accuracy;
        if (Number.isFinite(accuracyMeters) && accuracyMeters > this.accuracyThresholdMeters) {
          return;
        }

        const smoothedPoint = this.appendAndSmooth([browserPosition.coords.latitude, browserPosition.coords.longitude]);
        const timestampMs = browserPosition.timestamp || Date.now();
        const speedKmh = this.deriveSpeedKmh(smoothedPoint, timestampMs);

        const fix = {
          latitude: smoothedPoint[0],
          longitude: smoothedPoint[1],
          accuracyMeters: Number.isFinite(accuracyMeters) ? accuracyMeters : null,
          speedKmh,
          timestampMs,
          origin: PositionOrigin.DEVICE
        };

        this.previousSmoothedFix = fix;
        this.fixListener(fix);
      }

      appendAndSmooth(rawPoint) {
        this.recentPositions.push(rawPoint);
        if (this.recentPositions.length > this.movingAverageWindow) {
          this.recentPositions.shift();
        }

        const totals = this.recentPositions.reduce(
          (accumulator, point) => [accumulator[0] + point[0], accumulator[1] + point[1]],
          [0, 0]
        );
        return [totals[0] / this.recentPositions.length, totals[1] / this.recentPositions.length];
      }

      deriveSpeedKmh(smoothedPoint, timestampMs) {
        if (!this.previousSmoothedFix) {
          return 0;
        }

        const elapsedSeconds = (timestampMs - this.previousSmoothedFix.timestampMs) / 1000;
        if (elapsedSeconds < 0.25 || elapsedSeconds > 30) {
          return this.lastKnownSpeedKmh;
        }

        const travelledMeters = GeoMath.haversineDistanceMeters(
          [this.previousSmoothedFix.latitude, this.previousSmoothedFix.longitude],
          smoothedPoint
        );
        this.lastKnownSpeedKmh = (travelledMeters / elapsedSeconds) * 3.6;
        return this.lastKnownSpeedKmh;
      }
    }

    class PositionSimulator {
      constructor({ speedKmh, stepMeters, emitIntervalMs }) {
        this.speedMetersPerSecond = speedKmh / 3.6;
        this.stepMeters = stepMeters;
        this.emitIntervalMs = emitIntervalMs;
        this.densifiedPath = [];
        this.cumulativeDistances = [];
        this.totalDistanceMeters = 0;
        this.travelledMeters = 0;
        this.animationFrameId = null;
        this.previousFrameTimestamp = 0;
        this.lastEmitTimestamp = 0;
        this.fixListener = () => { };
        this.completionListener = () => { };
      }

      onFix(listener) {
        this.fixListener = listener;
      }

      onCompletion(listener) {
        this.completionListener = listener;
      }

      loadPath(pathCoordinates) {
        this.densifiedPath = GeoMath.densifyPolyline(pathCoordinates, this.stepMeters);
        this.cumulativeDistances = GeoMath.buildCumulativeDistances(this.densifiedPath);
        this.totalDistanceMeters = this.cumulativeDistances[this.cumulativeDistances.length - 1] ?? 0;
        this.travelledMeters = 0;
      }

      get isRunning() {
        return this.animationFrameId !== null;
      }

      get hasPath() {
        return this.densifiedPath.length > 1 && this.totalDistanceMeters > 0;
      }

      start() {
        if (this.isRunning || !this.hasPath) {
          return false;
        }
        if (this.travelledMeters >= this.totalDistanceMeters) {
          this.travelledMeters = 0;
        }

        this.previousFrameTimestamp = performance.now();
        this.lastEmitTimestamp = 0;
        this.emitFixAtTravelledDistance();
        this.animationFrameId = requestAnimationFrame((frameTimestamp) => this.advance(frameTimestamp));
        return true;
      }

      stop() {
        if (!this.isRunning) {
          return;
        }
        cancelAnimationFrame(this.animationFrameId);
        this.animationFrameId = null;
      }

      advance(frameTimestamp) {
        const elapsedSeconds = (frameTimestamp - this.previousFrameTimestamp) / 1000;
        this.previousFrameTimestamp = frameTimestamp;
        this.travelledMeters = Math.min(
          this.totalDistanceMeters,
          this.travelledMeters + this.speedMetersPerSecond * elapsedSeconds
        );

        if (frameTimestamp - this.lastEmitTimestamp >= this.emitIntervalMs) {
          this.lastEmitTimestamp = frameTimestamp;
          this.emitFixAtTravelledDistance();
        }

        if (this.travelledMeters >= this.totalDistanceMeters) {
          this.emitFixAtTravelledDistance();
          this.stop();
          this.completionListener();
          return;
        }

        this.animationFrameId = requestAnimationFrame((nextFrameTimestamp) => this.advance(nextFrameTimestamp));
      }

      emitFixAtTravelledDistance() {
        const point = this.pointAtDistance(this.travelledMeters);
        this.fixListener({
          latitude: point[0],
          longitude: point[1],
          accuracyMeters: 6,
          speedKmh: this.speedMetersPerSecond * 3.6,
          timestampMs: Date.now(),
          origin: PositionOrigin.SIMULATION
        });
      }

      pointAtDistance(distanceMeters) {
        if (distanceMeters <= 0) {
          return this.densifiedPath[0];
        }
        if (distanceMeters >= this.totalDistanceMeters) {
          return this.densifiedPath[this.densifiedPath.length - 1];
        }

        let upperIndex = 1;
        while (upperIndex < this.cumulativeDistances.length && this.cumulativeDistances[upperIndex] < distanceMeters) {
          upperIndex += 1;
        }

        const lowerDistance = this.cumulativeDistances[upperIndex - 1];
        const segmentLength = this.cumulativeDistances[upperIndex] - lowerDistance;
        const segmentRatio = segmentLength > 0 ? (distanceMeters - lowerDistance) / segmentLength : 0;
        return GeoMath.interpolateBetween(this.densifiedPath[upperIndex - 1], this.densifiedPath[upperIndex], segmentRatio);
      }
    }

    class MotionPreference {
      static prefersReducedMotion() {
        return window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    class MapRenderer {
      constructor(containerId, configuration) {
        this.markerAnimationDurationMs = configuration.markerAnimationDurationMs;
        this.vehicleFocusZoom = configuration.vehicleFocusZoom;
        this.containerElement = document.getElementById(containerId);
        this.map = L.map(containerId, { zoomControl: true, attributionControl: true });
        L.tileLayer(configuration.tileLayerUrl, {
          maxZoom: 19,
          attribution: configuration.tileLayerAttribution
        }).addTo(this.map);
        this.map.setView(configuration.origin, 13);

        this.routeLayersByOptionId = new Map();
        this.zoneLayersByCode = new Map();
        this.endpointLayerGroup = L.layerGroup().addTo(this.map);
        this.vehicleMarker = null;
        this.accuracyCircle = null;
        this.animationFrameId = null;
        this.displayedPosition = null;
        this.shouldFollowVehicle = true;
        this.isProgrammaticMapUpdate = false;
        this.userInteractionListener = () => { };
        this.routeSelectionListener = () => { };

        this.map.on("dragstart zoomstart", () => {
          if (!this.isProgrammaticMapUpdate) {
            this.userInteractionListener();
          }
        });
        new ResizeObserver(() => this.map.invalidateSize({ animate: false })).observe(this.containerElement);
      }

      static readBrandColor(customPropertyName) {
        return getComputedStyle(document.documentElement).getPropertyValue(customPropertyName).trim();
      }

      onUserInteraction(listener) {
        this.userInteractionListener = listener;
      }

      onRouteSelection(listener) {
        this.routeSelectionListener = listener;
      }

      runProgrammaticMapUpdate(mapUpdate) {
        this.isProgrammaticMapUpdate = true;
        mapUpdate();
        this.isProgrammaticMapUpdate = false;
      }

      setFollowVehicle(shouldFollow) {
        this.shouldFollowVehicle = shouldFollow;
        if (shouldFollow && this.displayedPosition) {
          this.runProgrammaticMapUpdate(() => this.map.panTo(this.displayedPosition, { animate: false }));
        }
      }

      renderRouteOptions(routeModels, activeRouteId, endpointLabels) {
        this.routeLayersByOptionId.forEach((layers) => layers.forEach((layer) => layer.remove()));
        this.routeLayersByOptionId.clear();

        routeModels.forEach((routeModel) => {
          const casingLayer = L.polyline(routeModel.coordinates, {
            color: "#FFFFFF",
            weight: 9,
            opacity: 0.9,
            lineJoin: "round",
            lineCap: "round"
          }).addTo(this.map);

          const routeLayer = L.polyline(routeModel.coordinates, {
            color: MapRenderer.readBrandColor("--brand"),
            weight: 4.5,
            opacity: 1,
            lineJoin: "round",
            lineCap: "round"
          })
            .on("click", () => this.routeSelectionListener(routeModel.id))
            .addTo(this.map);

          this.routeLayersByOptionId.set(routeModel.id, [casingLayer, routeLayer]);
        });

        this.applyActiveRouteStyles(activeRouteId);
        this.renderEndpoints(routeModels[0].coordinates, endpointLabels);

        const overallBounds = routeModels.reduce(
          (bounds, routeModel) => bounds.extend(L.latLngBounds(routeModel.coordinates)),
          L.latLngBounds(routeModels[0].coordinates)
        );

        this.map.invalidateSize({ animate: false });
        this.runProgrammaticMapUpdate(() => this.map.fitBounds(overallBounds, { padding: [46, 46], animate: false }));
      }

      applyActiveRouteStyles(activeRouteId) {
        this.routeLayersByOptionId.forEach((layers, routeOptionId) => {
          const isActive = routeOptionId === activeRouteId;
          const [casingLayer, routeLayer] = layers;

          casingLayer.setStyle({ opacity: isActive ? 0.9 : 0.55, weight: isActive ? 9 : 6 });
          routeLayer.setStyle({
            color: isActive ? MapRenderer.readBrandColor("--brand") : MapRenderer.readBrandColor("--inactive-route"),
            weight: isActive ? 4.5 : 2.5,
            opacity: isActive ? 1 : 0.85,
            dashArray: isActive ? null : "6 5"
          });

          if (isActive) {
            routeLayer.bringToFront();
          }
        });

        if (this.vehicleMarker) {
          this.vehicleMarker.setZIndexOffset(1000);
        }
      }

      renderEndpoints(pathCoordinates, endpointLabels) {
        this.endpointLayerGroup.clearLayers();

        const endpoints = [
          { position: pathCoordinates[0], label: endpointLabels.origin, isDestination: false },
          { position: pathCoordinates[pathCoordinates.length - 1], label: endpointLabels.destination, isDestination: true }
        ];

        endpoints.forEach((endpoint) => {
          L.marker(endpoint.position, {
            icon: L.divIcon({
              className: "endpoint-marker",
              html: `<span class="endpoint-marker__pin${endpoint.isDestination ? " endpoint-marker__pin--destination" : ""}"></span>`,
              iconSize: [16, 16],
              iconAnchor: [8, 8]
            }),
            keyboard: false
          })
            .bindTooltip(endpoint.label, { direction: "top", offset: [0, -8] })
            .addTo(this.endpointLayerGroup);
        });
      }

      renderZones(zones, zoneLabelResolver) {
        this.zoneLayersByCode.forEach((layer) => layer.remove());
        this.zoneLayersByCode.clear();

        zones.forEach((zone) => {
          const zoneColor = MapRenderer.readBrandColor(
            zone.enforcement === ZoneEnforcement.PROHIBITED ? "--status-restricted" : "--status-deviation"
          );

          const zoneLayer = L.polygon(zone.polygon, {
            color: zoneColor,
            weight: 1.5,
            opacity: 0.8,
            dashArray: zone.enforcement === ZoneEnforcement.PROHIBITED ? "5 4" : "2 4",
            fillColor: zoneColor,
            fillOpacity: zone.enforcement === ZoneEnforcement.PROHIBITED ? 0.11 : 0.06
          }).addTo(this.map);

          zoneLayer.bindTooltip(zoneLabelResolver(zone), {
            direction: "center",
            className: `zone-tooltip zone-tooltip--${zone.enforcement}`
          });

          this.zoneLayersByCode.set(zone.code, zoneLayer);
        });
      }

      updateZoneLabels(zoneLabelResolver, zones) {
        zones.forEach((zone) => {
          this.zoneLayersByCode.get(zone.code)?.setTooltipContent(zoneLabelResolver(zone));
        });
      }

      updateEndpointLabels(endpointLabels) {
        const endpointMarkers = this.endpointLayerGroup.getLayers();
        endpointMarkers[0]?.setTooltipContent(endpointLabels.origin);
        endpointMarkers[1]?.setTooltipContent(endpointLabels.destination);
      }

      showVehicleAt(position, accuracyMeters) {
        if (!this.vehicleMarker) {
          this.vehicleMarker = L.marker(position, {
            icon: L.divIcon({
              className: "vehicle-marker",
              html: '<span class="vehicle-marker__pulse"></span><span class="vehicle-marker__core"></span>',
              iconSize: [20, 20],
              iconAnchor: [10, 10]
            }),
            keyboard: false,
            interactive: false,
            zIndexOffset: 1000
          }).addTo(this.map);
          this.displayedPosition = position;
          this.focusOnVehicle(position);
        } else {
          this.animateVehicleTo(position);
        }

        this.updateAccuracyCircle(position, accuracyMeters);
      }

      focusOnVehicle(position) {
        this.vehicleMarker.setLatLng(position);
        if (!this.shouldFollowVehicle) {
          return;
        }
        this.runProgrammaticMapUpdate(() =>
          this.map.setView(position, Math.max(this.map.getZoom(), this.vehicleFocusZoom), { animate: false })
        );
      }

      updateAccuracyCircle(position, accuracyMeters) {
        if (!Number.isFinite(accuracyMeters)) {
          return;
        }
        if (!this.accuracyCircle) {
          this.accuracyCircle = L.circle(position, {
            radius: accuracyMeters,
            color: MapRenderer.readBrandColor("--brand"),
            weight: 1,
            opacity: 0.4,
            fillOpacity: 0.08,
            interactive: false
          }).addTo(this.map);
          return;
        }
        this.accuracyCircle.setLatLng(position);
        this.accuracyCircle.setRadius(accuracyMeters);
      }

      animateVehicleTo(targetPosition) {
        if (this.animationFrameId !== null) {
          cancelAnimationFrame(this.animationFrameId);
          this.animationFrameId = null;
        }

        if (MotionPreference.prefersReducedMotion() || !this.displayedPosition) {
          this.displayedPosition = targetPosition;
          this.applyPositionToMap(targetPosition);
          return;
        }

        const startPosition = this.displayedPosition;
        const startTimestamp = performance.now();

        const step = (frameTimestamp) => {
          const progress = Math.min(1, (frameTimestamp - startTimestamp) / this.markerAnimationDurationMs);
          const easedProgress = 1 - (1 - progress) * (1 - progress);
          const intermediatePosition = GeoMath.interpolateBetween(startPosition, targetPosition, easedProgress);

          this.displayedPosition = intermediatePosition;
          this.applyPositionToMap(intermediatePosition);

          if (progress < 1) {
            this.animationFrameId = requestAnimationFrame(step);
            return;
          }
          this.animationFrameId = null;
        };

        this.animationFrameId = requestAnimationFrame(step);
      }

      applyPositionToMap(position) {
        this.vehicleMarker.setLatLng(position);
        if (this.shouldFollowVehicle) {
          this.runProgrammaticMapUpdate(() => this.map.panTo(position, { animate: false }));
        }
      }

      setVehicleState(state) {
        if (!this.vehicleMarker) {
          return;
        }
        this.vehicleMarker.getElement()?.setAttribute("data-state", state);
      }
    }

    class RouteOptionSelector {
      constructor(localizationService) {
        this.localizationService = localizationService;
        this.listElement = document.getElementById("routeOptionList");
        this.hintElement = document.getElementById("routeOptionsHint");
        this.selectionListener = () => { };
        this.routeModels = [];
        this.activeRouteId = null;
      }

      onSelection(listener) {
        this.selectionListener = listener;
      }

      render(routeModels, activeRouteId) {
        this.routeModels = routeModels;
        this.activeRouteId = activeRouteId;

        this.hintElement.textContent = this.localizationService.translate("ui.option.count", {
          count: routeModels.length
        });
        this.listElement.replaceChildren(...routeModels.map((routeModel) => this.buildOptionElement(routeModel)));
      }

      buildOptionElement(routeModel) {
        const itemElement = document.createElement("li");
        const buttonElement = document.createElement("button");
        buttonElement.type = "button";
        buttonElement.className = "option";
        buttonElement.setAttribute("aria-pressed", String(routeModel.id === this.activeRouteId));
        buttonElement.addEventListener("click", () => this.selectionListener(routeModel.id));

        const headElement = document.createElement("div");
        headElement.className = "option__head";

        const nameElement = document.createElement("span");
        nameElement.className = "option__name";
        nameElement.textContent = this.localizationService.translate(`routeOptions.${routeModel.id}.name`);
        headElement.appendChild(nameElement);

        if (routeModel.id === this.activeRouteId) {
          headElement.appendChild(this.buildBadge(this.localizationService.translate("ui.option.active"), false));
        } else if (routeModel.routeOption.isRecommended) {
          headElement.appendChild(this.buildBadge(this.localizationService.translate("ui.option.recommended"), true));
        }

        const metricsElement = document.createElement("div");
        metricsElement.className = "option__metrics";
        metricsElement.append(
          this.buildMetric(
            "icon-ruler",
            this.localizationService.translate("ui.units.kilometres", {
              value: this.localizationService.formatNumber(routeModel.routeOption.distanceMeters / 1000, 2)
            })
          ),
          this.buildMetric(
            "icon-clock",
            this.localizationService.translate("ui.units.minutes", {
              value: this.localizationService.formatNumber(routeModel.routeOption.durationSeconds / 60, 0)
            })
          )
        );

        const detailElement = document.createElement("p");
        detailElement.className = "option__detail";
        detailElement.textContent = this.localizationService.translate(`routeOptions.${routeModel.id}.detail`);

        buttonElement.append(headElement, metricsElement, detailElement);
        itemElement.appendChild(buttonElement);
        return itemElement;
      }

      buildBadge(label, isRecommendedBadge) {
        const badgeElement = document.createElement("span");
        badgeElement.className = `option__badge${isRecommendedBadge ? " option__badge--recommended" : ""}`;
        badgeElement.textContent = label;
        return badgeElement;
      }

      buildMetric(iconName, label) {
        const metricElement = document.createElement("span");
        metricElement.className = "option__metric";
        metricElement.appendChild(IconFactory.create(iconName));
        const labelElement = document.createElement("span");
        labelElement.textContent = label;
        metricElement.appendChild(labelElement);
        return metricElement;
      }
    }

    class RegulationBoard {
      constructor(localizationService) {
        this.localizationService = localizationService;
        this.regulationListElement = document.getElementById("regulationList");
        this.recommendationListElement = document.getElementById("recommendationList");
        this.regulationCountElement = document.getElementById("regulationCount");
        this.zoneBannerElement = document.getElementById("zoneBanner");
        this.zoneBannerValueElement = document.getElementById("zoneBannerValue");
        this.regulationElementsByCode = new Map();
        this.activeRegulationCode = null;
        this.currentZone = null;
      }

      render(regulations, recommendations) {
        this.regulationElementsByCode.clear();
        this.regulationListElement.replaceChildren(
          ...regulations.map((regulation) => this.buildRegulationElement(regulation))
        );
        this.recommendationListElement.replaceChildren(
          ...recommendations.map((recommendation) => this.buildRecommendationElement(recommendation))
        );
        this.regulationCountElement.textContent = this.localizationService.translate("ui.regulation.count", {
          count: regulations.length
        });
        this.restoreActiveHighlight();
      }

      buildRegulationElement(regulation) {
        const itemElement = this.buildRuleShell(
          regulation.icon,
          this.localizationService.translate(`regulations.${regulation.code}.title`),
          this.localizationService.translate(`regulations.${regulation.code}.detail`)
        );
        itemElement.dataset.enforcement = regulation.enforcement;

        const headElement = itemElement.querySelector(".rule__head");
        const codeElement = document.createElement("span");
        codeElement.className = "rule__code";
        codeElement.textContent = regulation.code;

        const tagElement = document.createElement("span");
        tagElement.className = "rule__tag";
        tagElement.dataset.enforcement = regulation.enforcement;
        tagElement.textContent = this.localizationService.translate(`ui.enforcement.${regulation.enforcement}`);

        headElement.prepend(codeElement, tagElement);
        this.regulationElementsByCode.set(regulation.code, itemElement);
        return itemElement;
      }

      buildRecommendationElement(recommendation) {
        return this.buildRuleShell(
          recommendation.icon,
          this.localizationService.translate(`recommendations.${recommendation.code}.title`),
          this.localizationService.translate(`recommendations.${recommendation.code}.detail`)
        );
      }

      buildRuleShell(iconName, title, detail) {
        const itemElement = document.createElement("li");
        itemElement.className = "rule";

        const glyphElement = document.createElement("span");
        glyphElement.className = "rule__glyph";
        glyphElement.appendChild(IconFactory.create(iconName));

        const bodyElement = document.createElement("div");
        bodyElement.className = "rule__body";

        const headElement = document.createElement("div");
        headElement.className = "rule__head";

        const titleElement = document.createElement("span");
        titleElement.className = "rule__title";
        titleElement.textContent = title;
        headElement.appendChild(titleElement);

        const detailElement = document.createElement("p");
        detailElement.className = "rule__detail";
        detailElement.textContent = detail;

        bodyElement.append(headElement, detailElement);
        itemElement.append(glyphElement, bodyElement);
        return itemElement;
      }

      renderCurrentZone(zone) {
        this.currentZone = zone;

        if (!zone) {
          this.zoneBannerElement.removeAttribute("data-enforcement");
          this.zoneBannerValueElement.textContent = this.localizationService.translate("ui.zone.none");
          this.clearHighlight();
          return;
        }

        this.zoneBannerElement.dataset.enforcement = zone.enforcement;
        this.zoneBannerValueElement.textContent = `${this.localizationService.translate(
          `regulations.${zone.code}.zone`
        )} · ${zone.code}`;
        this.highlightRegulation(zone.code);
      }

      highlightRegulation(regulationCode) {
        if (this.activeRegulationCode === regulationCode) {
          return;
        }
        this.clearHighlight();
        this.activeRegulationCode = regulationCode;

        const targetElement = this.regulationElementsByCode.get(regulationCode);
        if (!targetElement) {
          return;
        }
        targetElement.dataset.active = "true";
        targetElement.scrollIntoView({
          behavior: MotionPreference.prefersReducedMotion() ? "auto" : "smooth",
          block: "nearest"
        });
      }

      clearHighlight() {
        if (this.activeRegulationCode === null) {
          return;
        }
        this.regulationElementsByCode.get(this.activeRegulationCode)?.removeAttribute("data-active");
        this.activeRegulationCode = null;
      }

      refreshLocalizedText() {
        this.renderCurrentZone(this.currentZone);
      }

      restoreActiveHighlight() {
        if (this.activeRegulationCode === null) {
          return;
        }
        const targetElement = this.regulationElementsByCode.get(this.activeRegulationCode);
        if (targetElement) {
          targetElement.dataset.active = "true";
        }
      }
    }
