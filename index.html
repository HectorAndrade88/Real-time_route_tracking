        this.lastRouteOptionId = null;
        this.lastPathSource = null;
      }

      renderRouteName(routeOptionId) {
        this.lastRouteOptionId = routeOptionId;
        this.routeNameElement.textContent = this.localizationService.translate(`routeOptions.${routeOptionId}.name`);
      }

      renderPathSource(pathSource) {
        this.lastPathSource = pathSource;
        this.routeSourceElement.textContent = this.localizationService.translate(`ui.source.${pathSource}`);
      }

      renderFix(fix) {
        this.latitudeElement.textContent = fix.latitude.toFixed(5);
        this.longitudeElement.textContent = fix.longitude.toFixed(5);
        this.speedElement.textContent = `${fix.speedKmh.toFixed(1)} km/h`;
        this.accuracyElement.textContent = Number.isFinite(fix.accuracyMeters)
          ? `± ${Math.round(fix.accuracyMeters)} m`
          : "± — m";
      }

      renderEvaluation(evaluation) {
        this.lastEvaluation = evaluation;
        this.distanceElement.textContent = TelemetryPanel.formatDistance(evaluation.distanceToRouteMeters);
        this.distanceCellElement.dataset.state = evaluation.state;
        this.statusPillElement.dataset.state = evaluation.state;
        this.statusLabelElement.textContent = evaluation.activeZone
          ? `${this.localizationService.translate(`ui.status.${evaluation.state}`)} · ${this.localizationService.translate(
            `regulations.${evaluation.activeZone.code}.zone`
          )}`
          : this.localizationService.translate(`ui.status.${evaluation.state}`);
      }

      renderIdleStatus() {
        this.statusLabelElement.textContent = this.localizationService.translate("ui.status.unknown");
      }

      refreshLocalizedText() {
        if (this.lastRouteOptionId) {
          this.renderRouteName(this.lastRouteOptionId);
        }
        if (this.lastPathSource) {
          this.renderPathSource(this.lastPathSource);
        }
        if (this.lastEvaluation) {
          this.renderEvaluation(this.lastEvaluation);
          return;
        }
        this.renderIdleStatus();
      }

      static formatDistance(distanceMeters) {
        if (!Number.isFinite(distanceMeters)) {
          return "—";
        }
        return distanceMeters >= 1000 ? `${(distanceMeters / 1000).toFixed(2)} km` : `${Math.round(distanceMeters)} m`;
      }
    }

    class ScreenWakeLockManager {
      constructor() {
        this.wakeLockSentinel = null;
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible" && this.wakeLockSentinel === null) {
            this.request();
          }
        });
      }

      get isSupported() {
        return "wakeLock" in navigator;
      }

      async request() {
        if (!this.isSupported) {
          return;
        }
        try {
          this.wakeLockSentinel = await navigator.wakeLock.request("screen");
          this.wakeLockSentinel.addEventListener("release", () => {
            this.wakeLockSentinel = null;
          });
        } catch (wakeLockError) {
          this.wakeLockSentinel = null;
        }
      }
    }

    class TrackingApp {
      constructor(configuration, localizationCatalog) {
        this.configuration = configuration;
        this.localizationService = new LocalizationService(localizationCatalog);
        this.languageSwitcher = new LanguageSwitcher(this.localizationService);
        this.routePlanner = new RoutePlanner(configuration);
        this.mapRenderer = new MapRenderer("map", configuration);
        this.brandHeader = new BrandHeader();
        this.bookingPanel = new BookingPanel();
        this.routeOptionSelector = new RouteOptionSelector(this.localizationService);
        this.regulationBoard = new RegulationBoard(this.localizationService);
        this.telemetryPanel = new TelemetryPanel(this.localizationService);
        this.noticeCenter = new NoticeCenter(document.getElementById("noticeStack"));
        this.zoneEvaluator = new AirportZoneEvaluator(configuration.regulations);
        this.geolocationTracker = new GeolocationTracker(configuration);
        this.positionSimulator = new PositionSimulator({
          speedKmh: configuration.simulationSpeedKmh,
          stepMeters: configuration.simulationStepMeters,
          emitIntervalMs: configuration.simulationEmitIntervalMs
        });
        this.wakeLockManager = new ScreenWakeLockManager();
        this.routeOptionRegistry = null;
        this.lastReportedState = TrackingState.UNKNOWN;
        this.lastReportedZoneCode = null;
        this.hasReceivedDeviceFix = false;

        this.simulationToggleElement = document.getElementById("simulationToggle");
        this.simulationToggleLabelElement = document.getElementById("simulationToggleLabel");
        this.followToggleElement = document.getElementById("followToggle");
        this.followToggleLabelElement = document.getElementById("followToggleLabel");
      }

      async start() {
        document.documentElement.lang = this.localizationService.currentLanguageCode;
        this.languageSwitcher.render();
        this.localizationService.applyToDocument();
        this.brandHeader.render(this.configuration.operator);
        this.bookingPanel.render(this.configuration.booking);
        this.regulationBoard.render(this.configuration.regulations, this.configuration.recommendations);
        this.regulationBoard.renderCurrentZone(null);
        this.telemetryPanel.renderIdleStatus();
        this.mapRenderer.renderZones(this.zoneEvaluator.zones, (zone) => this.resolveZoneLabel(zone));
        this.updateControlLabels();
        this.bindControls();

        const resolvedOptions = await this.routePlanner.resolveRouteOptions();
        this.routeOptionRegistry = new RouteOptionRegistry(
          resolvedOptions.map(
            (routeOption) =>
              new RouteModel({
                routeOption,
                corridorMeters: this.configuration.corridorMeters,
                zoneEvaluator: this.zoneEvaluator
              })
          )
        );

        this.mapRenderer.renderRouteOptions(
          this.routeOptionRegistry.models,
          this.routeOptionRegistry.activeModel.id,
          this.resolveEndpointLabels()
        );
        this.routeOptionSelector.render(this.routeOptionRegistry.models, this.routeOptionRegistry.activeModel.id);
        this.telemetryPanel.renderRouteName(this.routeOptionRegistry.activeModel.id);
        this.telemetryPanel.renderPathSource(this.routeOptionRegistry.activeModel.routeOption.source);
        this.positionSimulator.loadPath(this.routeOptionRegistry.activeModel.coordinates);

        if (this.routeOptionRegistry.activeModel.routeOption.source === PathSource.STRAIGHT_FALLBACK) {
          this.noticeCenter.publish(this.localizationService.translate("ui.notice.routingFallback"), "warning");
        }

        this.startDeviceTracking();
      }

      resolveZoneLabel(zone) {
        return `${this.localizationService.translate(`regulations.${zone.code}.zone`)} · ${zone.code}`;
      }

      resolveEndpointLabels() {
        return {
          origin: this.localizationService.translate("ui.map.origin"),
          destination: this.localizationService.translate("ui.map.destination")
        };
      }

      bindControls() {
        this.localizationService.onChange(() => this.applyLanguageChange());

        this.simulationToggleElement.addEventListener("click", () => this.toggleSimulation());

        this.followToggleElement.addEventListener("click", () => {
          const nextFollowState = this.followToggleElement.getAttribute("aria-pressed") !== "true";
          this.followToggleElement.setAttribute("aria-pressed", String(nextFollowState));
          this.mapRenderer.setFollowVehicle(nextFollowState);
        });

        this.mapRenderer.onUserInteraction(() => {
          this.followToggleElement.setAttribute("aria-pressed", "false");
          this.mapRenderer.setFollowVehicle(false);
        });

        this.routeOptionSelector.onSelection((routeOptionId) => this.selectRouteOption(routeOptionId, false));
        this.mapRenderer.onRouteSelection((routeOptionId) => this.selectRouteOption(routeOptionId, false));

        this.positionSimulator.onFix((fix) => this.consumeFix(fix));
        this.positionSimulator.onCompletion(() => {
          this.updateControlLabels();
          this.noticeCenter.publish(this.localizationService.translate("ui.notice.simulationFinished"));
        });

        this.geolocationTracker.onFix((fix) => {
          this.hasReceivedDeviceFix = true;
          if (this.positionSimulator.isRunning) {
            return;
          }
          this.consumeFix(fix);
        });

        this.geolocationTracker.onFailure((failure) => this.handleGeolocationFailure(failure));
      }

      applyLanguageChange() {
        this.localizationService.applyToDocument();
        this.regulationBoard.render(this.configuration.regulations, this.configuration.recommendations);
        this.regulationBoard.refreshLocalizedText();
        this.telemetryPanel.refreshLocalizedText();
        this.updateControlLabels();
        this.mapRenderer.updateZoneLabels((zone) => this.resolveZoneLabel(zone), this.zoneEvaluator.zones);
        this.mapRenderer.updateEndpointLabels(this.resolveEndpointLabels());

        if (!this.routeOptionRegistry) {
          return;
        }
        this.routeOptionSelector.render(this.routeOptionRegistry.models, this.routeOptionRegistry.activeModel.id);
      }

      selectRouteOption(routeOptionId, wasDetectedAutomatically) {
        if (!this.routeOptionRegistry || !this.routeOptionRegistry.selectById(routeOptionId)) {
          return;
        }

        const activeModel = this.routeOptionRegistry.activeModel;
        const wasSimulationRunning = this.positionSimulator.isRunning;

        this.positionSimulator.stop();
        this.positionSimulator.loadPath(activeModel.coordinates);
        if (wasSimulationRunning && !wasDetectedAutomatically) {
          this.positionSimulator.start();
        }
        this.updateControlLabels();

        this.mapRenderer.applyActiveRouteStyles(activeModel.id);
        this.routeOptionSelector.render(this.routeOptionRegistry.models, activeModel.id);
        this.telemetryPanel.renderRouteName(activeModel.id);
        this.telemetryPanel.renderPathSource(activeModel.routeOption.source);

        this.noticeCenter.publish(
          this.localizationService.translate(
            wasDetectedAutomatically ? "ui.notice.optionDetected" : "ui.notice.optionSwitched",
            { option: this.localizationService.translate(`routeOptions.${activeModel.id}.name`) }
          ),
          wasDetectedAutomatically ? "warning" : "info"
        );
      }

      startDeviceTracking() {
        const trackingStarted = this.geolocationTracker.start();
        if (trackingStarted) {
          this.wakeLockManager.request();
          return;
        }
        this.startSimulationAsFallback("ui.notice.geolocationUnsupported");
      }

      handleGeolocationFailure(failure) {
        if (this.hasReceivedDeviceFix || this.positionSimulator.isRunning) {
          return;
        }
        this.startSimulationAsFallback(
          failure.reason === "denied" ? "ui.notice.geolocationDenied" : "ui.notice.geolocationUnavailable"
        );
      }

      startSimulationAsFallback(messageKey) {
        this.noticeCenter.publish(this.localizationService.translate(messageKey), "warning");
        if (this.positionSimulator.hasPath) {
          this.positionSimulator.start();
          this.updateControlLabels();
        }
      }

      toggleSimulation() {
        if (this.positionSimulator.isRunning) {
          this.positionSimulator.stop();
          this.updateControlLabels();
          return;
        }

        if (!this.positionSimulator.start()) {
          this.noticeCenter.publish(this.localizationService.translate("ui.notice.routeNotReady"), "warning");
          return;
        }
        this.updateControlLabels();
      }

      updateControlLabels() {
        const isRunning = this.positionSimulator.isRunning;
        this.simulationToggleLabelElement.textContent = this.localizationService.translate(
          isRunning ? "ui.controls.simulationStop" : "ui.controls.simulationStart"
        );
        this.simulationToggleElement.setAttribute("aria-pressed", String(isRunning));
        this.followToggleLabelElement.textContent = this.localizationService.translate("ui.controls.follow");
      }

      consumeFix(fix) {
        if (!this.routeOptionRegistry) {
          return;
        }

        const currentPoint = [fix.latitude, fix.longitude];
        const matchingModel = this.routeOptionRegistry.findBetterMatchingModel(currentPoint);
        if (matchingModel) {
          this.selectRouteOption(matchingModel.id, true);
        }

        const evaluation = this.routeOptionRegistry.activeModel.evaluatePosition(currentPoint);

        this.mapRenderer.showVehicleAt(currentPoint, fix.accuracyMeters);
        this.mapRenderer.setVehicleState(evaluation.state);
        this.telemetryPanel.renderFix(fix);
        this.telemetryPanel.renderEvaluation(evaluation);
        this.regulationBoard.renderCurrentZone(evaluation.activeZone);
        this.announceZoneChange(evaluation);
        this.announceStateChange(evaluation);
      }

      announceZoneChange(evaluation) {
        const zoneCode = evaluation.activeZone?.code ?? null;
        if (zoneCode === this.lastReportedZoneCode) {
          return;
        }
        this.lastReportedZoneCode = zoneCode;

        if (!evaluation.activeZone || evaluation.activeZone.enforcement === ZoneEnforcement.PROHIBITED) {
          return;
        }

        this.noticeCenter.publish(
          this.localizationService.translate("ui.notice.regulatedZone", {
            zone: this.localizationService.translate(`regulations.${evaluation.activeZone.code}.zone`),
            code: evaluation.activeZone.code
          }),
          "warning"
        );
      }

      announceStateChange(evaluation) {
        if (evaluation.state === this.lastReportedState) {
          return;
        }
        this.lastReportedState = evaluation.state;

        if (evaluation.state === TrackingState.RESTRICTED) {
          this.noticeCenter.publish(
            this.localizationService.translate("ui.notice.prohibitedZone", {
              zone: this.localizationService.translate(`regulations.${evaluation.activeZone.code}.zone`),
              code: evaluation.activeZone.code
            }),
            "alert"
          );
          return;
        }

        if (evaluation.state === TrackingState.DEVIATION) {
          this.noticeCenter.publish(
            this.localizationService.translate("ui.notice.deviation", { meters: this.configuration.corridorMeters }),
            "warning"
          );
        }
      }
    }

    new TrackingApp(routeConfiguration, localization).start();
  </script>
</body>

</html>
